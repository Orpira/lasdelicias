# Si usas Nginx: /etc/nginx/sites-available/api-delicias.orpira.es
# Después:  ln -s ../sites-available/api-delicias.orpira.es /etc/nginx/sites-enabled/
#           certbot --nginx -d api-delicias.orpira.es
server {
	listen 80;
	listen [::]:80;
	server_name api-delicias.orpira.es;

	client_max_body_size 6m;   # fotos de productos (máx. 5 MB)

	location / {
		proxy_pass http://127.0.0.1:3001;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";

		# SSE: sin búfer y conexiones largas
		proxy_buffering off;
		proxy_cache off;
		proxy_read_timeout 1h;
	}
}
